<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#060d18"/>
    </linearGradient>
    <linearGradient id="trace-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00a8c8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bg-grad)"/>
  <!-- Subtle inner border glow -->
  <rect width="120" height="120" rx="24" fill="none" stroke="#00d4d4" stroke-width="1" stroke-opacity="0.2"/>

  <!-- ===== P LETTER (circuit board style) ===== -->
  <!-- Vertical spine of P -->
  <rect x="30" y="24" width="9" height="72" rx="2.5" fill="#00d4d4" filter="url(#glow)"/>

  <!-- Top horizontal bar -->
  <rect x="30" y="24" width="38" height="9" rx="2.5" fill="#00d4d4" filter="url(#glow)"/>

  <!-- Middle horizontal bar -->
  <rect x="30" y="53" width="38" height="9" rx="2.5" fill="#00d4d4" filter="url(#glow)"/>

  <!-- Right vertical of P bowl (top segment) -->
  <rect x="59" y="24" width="9" height="16" rx="2.5" fill="#00d4d4" filter="url(#glow)"/>

  <!-- Right vertical of P bowl (bottom segment) -->
  <rect x="59" y="46" width="9" height="16" rx="2.5" fill="#00d4d4" filter="url(#glow)"/>

  <!-- ===== CIRCUIT TRACES ===== -->

  <!-- Trace: right from top-right corner -->
  <rect x="68" y="27" width="18" height="3" rx="1.5" fill="url(#trace-grad)" filter="url(#glow-soft)"/>
  <!-- Dot at end -->
  <circle cx="89" cy="28.5" r="3.5" fill="#00d4d4" opacity="0.85" filter="url(#glow)"/>
  <!-- Small branch dot -->
  <circle cx="79" cy="28.5" r="2" fill="#00d4d4" opacity="0.5"/>

  <!-- Trace: right from middle -->
  <rect x="68" y="56" width="14" height="3" rx="1.5" fill="url(#trace-grad)" filter="url(#glow-soft)"/>
  <rect x="82" y="47" width="3" height="12" rx="1.5" fill="#00d4d4" opacity="0.5" filter="url(#glow-soft)"/>
  <circle cx="83.5" cy="46" r="3" fill="#00d4d4" opacity="0.8" filter="url(#glow)"/>

  <!-- Trace: left from bottom of spine going down-left -->
  <rect x="20" y="84" width="10" height="3" rx="1.5" fill="#00d4d4" opacity="0.5" filter="url(#glow-soft)"/>
  <circle cx="19" cy="85.5" r="3" fill="#00d4d4" opacity="0.75" filter="url(#glow)"/>

  <!-- Trace: bottom of spine going down -->
  <rect x="30" y="96" width="9" height="10" rx="2" fill="#00d4d4" opacity="0.35" filter="url(#glow-soft)"/>
  <circle cx="34.5" cy="108" r="2.5" fill="#00d4d4" opacity="0.6" filter="url(#glow)"/>

  <!-- Small accent dots scattered for circuit feel -->
  <circle cx="48" cy="14" r="2" fill="#00d4d4" opacity="0.35"/>
  <circle cx="72" cy="108" r="2" fill="#00d4d4" opacity="0.3"/>
  <circle cx="14" cy="50" r="1.5" fill="#00d4d4" opacity="0.3"/>
</svg>
